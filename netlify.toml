 [build]
   trailing_slash = "always"

[[redirects]]
  from = "https://www.ushangachronicles.com/*"
  to = "https://ushangachronicles.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/books"
  to = "https://ushangabooks-m4jy4icc.manus.space/books"
  status = 200
  force = true

[[redirects]]
  from = "/books/*"
  to = "https://ushangabooks-m4jy4icc.manus.space/books/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
